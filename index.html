<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hand AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    transform:scaleX(-1);
    pointer-events:none;
}

#word{
    position:fixed;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;

    padding:12px 25px;
    border-radius:30px;

    background:rgba(0,0,0,.7);
    border:2px solid #00e5ff;

    color:#00e5ff;
    font-size:25px;
    font-weight:bold;

    white-space:nowrap;
}

#start{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;

    border:0;
    border-radius:30px;
    padding:14px 28px;

    background:#00e5ff;
    color:#000;

    font-size:16px;
    font-weight:bold;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="word">TUNGGU...</div>

<button id="start">📷 MULAI KAMERA</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const word=document.getElementById("word");
const start=document.getElementById("start");

let lastGesture="";
let lastTime=0;

start.onclick=async()=>{

    try{

        const stream=await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user",
                width:1280,
                height:720
            },
            audio:false
        });

        video.srcObject=stream;

        const hands=new Hands({
            locateFile:file =>
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+file
        });

        hands.setOptions({
            maxNumHands:1,
            modelComplexity:1,
            minDetectionConfidence:.6,
            minTrackingConfidence:.6
        });

        hands.onResults(results=>{

            canvas.width=video.videoWidth;
            canvas.height=video.videoHeight;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            if(!results.multiHandLandmarks?.length){

                word.innerText="";

                lastGesture="";

                return;
            }

            const hand=results.multiHandLandmarks[0];

            drawHand(hand);

            const gesture=getGesture(hand);

            if(
                gesture &&
                gesture!==lastGesture &&
                Date.now()-lastTime>1000
            ){

                lastGesture=gesture;
                lastTime=Date.now();

                word.innerText=gesture;
            }

        });

        const cam=new Camera(video,{
            onFrame:async()=>{
                await hands.send({
                    image:video
                });
            },
            width:1280,
            height:720
        });

        cam.start();

        start.style.display="none";

    }catch(error){

        word.innerText="IZINKAN KAMERA";

        console.log(error);

    }

};


function drawHand(hand){

    const lines=[
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],
        [5,9],[9,13],[13,17]
    ];

    ctx.strokeStyle="#00e5ff";
    ctx.lineWidth=4;

    lines.forEach(([a,b])=>{

        ctx.beginPath();

        ctx.moveTo(
            hand[a].x*canvas.width,
            hand[a].y*canvas.height
        );

        ctx.lineTo(
            hand[b].x*canvas.width,
            hand[b].y*canvas.height
        );

        ctx.stroke();

    });

    ctx.fillStyle="#fff";

    hand.forEach(p=>{

        ctx.beginPath();

        ctx.arc(
            p.x*canvas.width,
            p.y*canvas.height,
            6,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

}


function up(hand,tip,pip){

    return hand[tip].y < hand[pip].y;

}


function getGesture(h){

    const index=up(h,8,6);
    const middle=up(h,12,10);
    const ring=up(h,16,14);
    const pinky=up(h,20,18);

    const thumb=
        Math.abs(h[4].x-h[17].x) >
        Math.abs(h[3].x-h[17].x);


    // ✋ = HALO
    if(
        index &&
        middle &&
        ring &&
        pinky &&
        thumb
    ){
        return "HALO";
    }


    // 👍 = SEMUA
    if(
        thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "SEMUA";
    }


    // ☝️ = DISINI
    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "DISINI";
    }


    // ✌️ = SAYA
    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){
        return "SAYA";
    }


    // 🤟 = BERHASIL
    if(
        thumb &&
        index &&
        pinky &&
        !middle &&
        !ring
    ){
        return "BERHASIL";
    }


    // ✊ = MEMBUAT
    if(
        !index &&
        !middle &&
        !ring &&
        !pinky &&
        !thumb
    ){
        return "MEMBUAT";
    }


    // 🖐️ = PYTHON SENDIRI
    if(
        index &&
        middle &&
        ring &&
        pinky
    ){
        return "PYTHON SENDIRI";
    }


    return "";

}

</script>

</body>
</html>
